project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

files:
  - source: /app/assets/i18n/gd3.zh_CN.ts
    translation: /app/assets/i18n/gd3.%locale_with_underscore%.ts
    languages_mapping:
      locale_with_underscore:
        en-US: en_US
        ja: ja_JP
        ru: ru_RU
        zh-TW: zh_TW
        zh-HK: zh_HK
        pt-BR: pt_BR
        es-ES: es_ES

  - source: /android/app/src/main/res/values/strings*.xml
    translation: /android/app/src/main/res/values-%android_code%/%original_file_name%
    type: android
    ignore:
      - /android/app/src/main/res/values/strings_engine.xml
    languages_mapping:
      android_code:
        en-US: en
        ja: ja
        ru: ru
        zh-TW: zh-rTW
        zh-HK: zh-rHK
        pt-BR: pt-rBR
        es-ES: es
