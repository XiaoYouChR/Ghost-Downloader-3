name: Bug 报告
description: 提交 Bug 报告
title: "[Bug] "
labels:
  - "🐛Bug"
body:
- type: checkboxes
  id: no-duplicate
  attributes:
    label: 检查清单
    options:
      - label: 我已搜索现有 Issue，确认没有重复
        required: true

- type: textarea
  id: description
  attributes:
    label: 描述
    description: 简述你遇到的问题
  validations:
    required: true

- type: textarea
  id: repro-steps
  attributes:
    label: 复现步骤
    render: markdown
    placeholder: |
      1. 打开应用
      2. 进入 '...'
      3. 点击 '...'
      4. 出现问题
  validations:
    required: true

- type: input
  id: source-url
  attributes:
    label: 复现源链接
    description: 触发此问题的下载链接，与链接无关填 N/A
    placeholder: "https://example.com/file.zip 或 N/A"
  validations:
    required: true

- type: textarea
  id: expected-behavior
  attributes:
    label: 预期行为
    render: markdown

- type: textarea
  id: screenshots
  attributes:
    label: 截图

- type: input
  id: gd-version
  attributes:
    label: Ghost Downloader 版本
    placeholder: "例: v4.2.6"
  validations:
    required: true

- type: input
  id: extension-version
  attributes:
    label: 浏览器扩展版本
    description: 与扩展无关填 N/A
    placeholder: "例: 1.2.0 或 N/A"
  validations:
    required: true

- type: dropdown
  id: os
  attributes:
    label: 操作系统
    options:
      - Windows 10
      - Windows 11
      - macOS
      - Linux
      - Android
  validations:
    required: true

- type: input
  id: os-detail
  attributes:
    label: 系统版本详情
    description: Windows 请运行 winver，Linux 请附带 glibc 版本（运行 ldd --version），Android 请注明版本、设备和 ROM 名称
    placeholder: "例: 24H2 Build 26200 / macOS 15.1 / Fedora 44 glibc 2.41 / Android 16 OPPO Find X8s ColorOS 16"
  validations:
    required: true

- type: textarea
  id: log-info
  attributes:
    label: 日志
    description: 粘贴报错内容，或 设置→关于→提供反馈→查看日志 后上传 GhostDownloader.log
  validations:
    required: true

- type: textarea
  id: additional-context
  attributes:
    label: 备注
    render: markdown
