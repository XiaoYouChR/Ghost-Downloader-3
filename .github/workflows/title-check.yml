name: Title Check
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.issue.title;
            if (/我的标题|My title/i.test(title) || /^\[(Bug|Feature)\]\s*$/.test(title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '请修改 issue 标题为对问题的简要描述。\nPlease update the issue title to a brief description of your problem.'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['🔍needs-info']
              });
            }
