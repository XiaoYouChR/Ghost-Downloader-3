name: Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_REPO_TOKEN:
        required: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libzstd1

      - name: Install dependencies
        run: |
          uv python install 3.13
          uv sync --locked

      - name: Run tests
        run: uv run pytest

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Android
        uses: actions/checkout@v7
        with:
          repository: XiaoYouChR/Ghost-Downloader-Android
          token: ${{ secrets.ANDROID_REPO_TOKEN }}
          path: android
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libzstd1
          uv python install 3.13
          uv sync --locked

      - name: Run Python tests
        run: uv run pytest tests/test_android.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Chaquopy build Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Kotlin tests without Android wheels
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -x installDebugPythonRequirements
