title: "[Language] "
body:
- type: markdown
  attributes:
    value: |
      感谢参与翻译！本项目通过 [Crowdin](https://gdi18n.xychr.com) 统一维护译文，无需在此上传 `.ts`、`messages.json` 等文件。如果你的语言已在 Crowdin 中，欢迎直接前往贡献；若尚未添加，请填写下方语言名称，我们会尽快开启。

      Thank you for helping translate! Translations are managed on [Crowdin](https://gdi18n.xychr.com), so there's no need to attach `.ts`, `messages.json`, or other translation files here. If your language is already available on Crowdin, feel free to jump right in; otherwise, let us know the language below and we'll add it soon.

- type: input
  id: language
  attributes:
    label: 语言 / Language
    description: 例如 Turkish (Türkçe) / e.g. Turkish (Türkçe)
  validations:
    required: true
